<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎓 考研助手智能体</title>
<style>
:root{--p:#4f46e5;--pl:#6366f1;--pd:#3730a3;--a:#10b981;--w:#f59e0b;--bg:#f8fafc;--s:#fff;--t:#1e293b;--tm:#64748b;--b:#e2e8f0;--r:12px;--rs:8px;--sh:0 1px 3px rgba(0,0,0,.08)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--t);line-height:1.6;min-height:100vh}
.navbar{background:linear-gradient(135deg,var(--pd),var(--p));color:#fff;position:sticky;top:0;z-index:100;box-shadow:0 2px 10px rgba(79,70,229,.3)}
.nav-inner{max-width:1200px;margin:0 auto;padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:56px}
.nav-brand{font-size:1.1rem;font-weight:700;color:#fff;text-decoration:none;cursor:pointer}
.nav-links{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.nav-links a{color:rgba(255,255,255,.85);text-decoration:none;padding:5px 12px;border-radius:8px;font-size:.85rem;transition:.2s;cursor:pointer}
.nav-links a:hover{background:rgba(255,255,255,.15);color:#fff}
.nav-links .ai-dot{width:8px;height:8px;border-radius:50%;margin-left:8px}
.dot-on{background:var(--a);box-shadow:0 0 6px var(--a)}
.dot-off{background:rgba(255,255,255,.4)}
.menu-btn{display:none;background:none;border:none;color:#fff;font-size:1.4rem;cursor:pointer}
main{max-width:1200px;margin:0 auto;padding:24px 20px}
.hero{text-align:center;padding:40px 20px 24px}
.hero h1{font-size:2rem;margin-bottom:8px}
.hero p{color:var(--tm)}
.badges{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:16px}
.badges span{background:var(--s);border:1px solid var(--b);padding:6px 14px;border-radius:99px;font-size:.85rem}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-top:8px}
.card{background:var(--s);border:1px solid var(--b);border-radius:var(--r);padding:24px 20px;text-decoration:none;color:var(--t);box-shadow:var(--sh);cursor:pointer;transition:.2s;display:flex;gap:12px;align-items:flex-start}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.1);border-color:var(--pl)}
.icon{font-size:2rem}
.card h3{font-size:1rem;margin-bottom:4px}
.card p{font-size:.8rem;color:var(--tm)}
.badge{display:inline-block;background:var(--bg);padding:2px 8px;border-radius:99px;font-size:.7rem;color:var(--tm);margin-top:4px}
.section{background:var(--s);border:1px solid var(--b);border-radius:var(--r);padding:24px;margin-top:24px;box-shadow:var(--sh)}
.section h2{font-size:1.2rem;margin-bottom:16px}
.steps{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px}
.step{display:flex;flex-direction:column;align-items:center;gap:4px}
.step-num{width:36px;height:36px;border-radius:50%;background:var(--p);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem}
.step-label{font-size:.75rem;color:var(--tm)}
.warn{border-left:4px solid var(--w)}
.warn ul{padding-left:20px}
.warn li{margin-bottom:4px;font-size:.9rem;color:var(--tm)}
.footer{text-align:center;padding:20px;border-top:1px solid var(--b);color:var(--tm);font-size:.8rem;margin-top:40px}
.report-layout{display:grid;grid-template-columns:380px 1fr;gap:20px;align-items:start}
.form-card{background:var(--s);border:1px solid var(--b);border-radius:var(--r);padding:24px;box-shadow:var(--sh);position:sticky;top:72px}
.form-card h2{font-size:1.1rem;margin-bottom:4px}
.form-hint{font-size:.8rem;color:var(--tm);margin-bottom:16px}
.fg{margin-bottom:14px}
.fg label{display:block;font-weight:600;font-size:.85rem;margin-bottom:4px}
.req{color:#ef4444}
input[type=text],input[type=number],textarea,select{width:100%;padding:8px 12px;border:1px solid var(--b);border-radius:var(--rs);font-size:.85rem;font-family:inherit;background:#fff;color:var(--t)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 3px rgba(79,70,229,.1)}
textarea{resize:vertical;min-height:70px}
.file-up{position:relative}
.file-up input[type=file]{display:none}
.file-up label{display:flex;flex-direction:column;align-items:center;gap:2px;padding:16px;border:2px dashed var(--b);border-radius:var(--rs);cursor:pointer;text-align:center;font-size:.85rem}
.file-up label:hover{border-color:var(--p);background:rgba(79,70,229,.02)}
.btn-gen{width:100%;padding:12px;background:linear-gradient(135deg,var(--p),var(--pl));color:#fff;border:none;border-radius:var(--rs);font-size:1rem;font-weight:600;cursor:pointer;margin-top:8px;transition:.2s}
.btn-gen:hover{transform:translateY(-1px)}
.btn-gen:disabled{opacity:.6;cursor:not-allowed;transform:none}
.btn-gen.outline{background:transparent;border:1.5px solid var(--p);color:var(--p);box-shadow:none;margin-top:4px;font-size:.8rem;padding:8px}
.btn-gen.outline:hover{background:var(--p);color:#fff}
.api-badge{margin-top:6px;font-size:.75rem;display:flex;align-items:center;gap:4px;justify-content:center}
.result-box{min-height:400px}
.placeholder{background:var(--s);border:1px solid var(--b);border-radius:var(--r);padding:60px 40px;text-align:center;box-shadow:var(--sh)}
.p-icon{font-size:3.5rem;margin-bottom:12px}
.placeholder h3{color:var(--tm)}
.report-body{background:var(--s);border:1px solid var(--b);border-radius:var(--r);box-shadow:var(--sh);padding:24px 28px;line-height:1.8;font-size:.9rem}
.report-body h1{font-size:1.4rem;margin:20px 0 14px;padding-bottom:6px;border-bottom:2px solid var(--b)}
.report-body h2{font-size:1.15rem;margin:16px 0 10px;color:var(--pd)}
.report-body h3{font-size:1rem;margin:12px 0 8px}
.report-body hr{border:none;border-top:1px solid var(--b);margin:16px 0}
.report-body blockquote{border-left:4px solid var(--pl);margin:10px 0;padding:8px 14px;background:rgba(79,70,229,.04);border-radius:0 var(--rs) var(--rs) 0;color:var(--tm)}
.report-body table{width:100%;border-collapse:collapse;margin:10px 0;font-size:.85rem}
.report-body th,.report-body td{border:1px solid var(--b);padding:6px 10px;text-align:left}
.report-body th{background:var(--bg)}
.report-body ul,.report-body ol{padding-left:22px;margin:6px 0}
.report-body li{margin-bottom:3px}
.toolbar{display:flex;gap:8px;padding:12px 20px;border-bottom:1px solid var(--b);background:var(--s);border-radius:var(--r) var(--r) 0 0}
.toolbar button{padding:6px 14px;border:1px solid var(--b);border-radius:var(--rs);font-size:.85rem;cursor:pointer;background:#fff}
.btn-dl{background:var(--p)!important;color:#fff!important;border-color:var(--p)!important}
.loading{text-align:center;padding:60px}
.spinner{width:40px;height:40px;border:4px solid var(--b);border-top-color:var(--p);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.settings-panel{background:var(--s);border:1px solid var(--b);border-radius:var(--r);padding:20px 24px;max-width:500px;margin:20px auto;box-shadow:var(--sh)}
.settings-panel label{font-weight:600;font-size:.9rem;display:block;margin-bottom:4px}
.settings-panel .hint{font-size:.78rem;color:var(--tm);margin-bottom:12px}
.settings-panel .hint a{color:var(--p)}
.settings-panel .btn-row{display:flex;gap:8px;margin-top:12px}
.settings-panel .btn-row button{padding:6px 16px;border-radius:var(--rs);border:1px solid var(--b);cursor:pointer;font-size:.85rem}
.settings-panel .btn-row .btn-save{background:var(--p);color:#fff;border-color:var(--p)}
.history{margin-top:30px}
.history h3{margin-bottom:12px}
.h-item{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--bg);border-radius:var(--rs);margin-bottom:6px;font-size:.85rem}
.h-item a{color:var(--p);text-decoration:none;margin-left:auto}
.h-empty{color:var(--tm);text-align:center;padding:20px}
.streaming{cursor:default}
.streaming::after{content:'▋';animation:blink 1s infinite;color:var(--p)}
@keyframes blink{50%{opacity:0}}
@media(max-width:800px){.report-layout{grid-template-columns:1fr}.form-card{position:static}.nav-links{display:none;flex-direction:column;position:absolute;top:56px;left:0;right:0;background:var(--pd);padding:12px}.nav-links.show{display:flex}.menu-btn{display:block}.hero h1{font-size:1.5rem}.cards{grid-template-columns:1fr}.steps{flex-direction:column}}
</style>
</head>
<body>

<nav class="navbar">
  <div class="nav-inner">
    <a class="nav-brand" onclick="showHome()">🎓 考研助手智能体 <small style="opacity:.7;font-weight:400">v2.0</small></a>
    <button class="menu-btn" onclick="document.querySelector('.nav-links').classList.toggle('show')" aria-label="菜单">☰</button>
    <div class="nav-links" id="navLinks">
      <a onclick="showHome()">首页</a>
      <a onclick="showReport('school_analysis')">🏫 择校</a>
      <a onclick="showReport('study_plan')">📅 规划</a>
      <a onclick="showReport('knowledge_qa')">💡 答疑</a>
      <a onclick="showReport('error_review')">📝 错题</a>
      <a onclick="showReport('progress_track')">📊 进度</a>
      <a onclick="showSettings()" title="API 设置">⚙️</a>
      <span class="ai-dot" id="aiDot" title="AI状态"></span>
    </div>
  </div>
</nav>

<main id="app"></main>

<footer class="footer">
  <p>🎓 考研助手智能体 · Agent 2.0 · 基于《人人能懂的AI智能体》方法论</p>
  <p style="color:var(--w);margin-top:2px">🤖 Claude AI 驱动 | ⚠️ 数据以研招网（yz.chsi.com.cn）及院校官网当年公布为准</p>
</footer>

<script>
// ==================== 核心配置 ====================
var API_URL = 'https://api.anthropic.com/v1/messages';
var MODEL = 'claude-sonnet-4-20250514';

function getApiKey(){ return localStorage.getItem('ky_apikey')||''; }
function setApiKey(k){ localStorage.setItem('ky_apikey',k); updateAiDot(); }
function updateAiDot(){
  var d=document.getElementById('aiDot'); if(!d)return;
  d.className='ai-dot '+(getApiKey()?'dot-on':'dot-off');
  d.title=getApiKey()?'AI 已就绪 (Claude)':'AI 未配置 - 请点 ⚙️ 设置 API Key';
}

// ==================== 数据定义 ====================
var TEMPLATES={
school_analysis:{title:"择校分析报告",icon:"🏫",desc:"输入目标专业、院校候选和自身条件，获得难度与匹配度评估",fields:[{id:"target_major",label:"目标专业",type:"text",placeholder:"如：计算机科学与技术",required:!0},{id:"target_schools",label:"候选院校（换行分隔）",type:"textarea",placeholder:"如：\n浙江大学\n上海交通大学\n华中科技大学",required:!0},{id:"background",label:"本科院校与专业",type:"text",placeholder:"如：XX大学 软件工程（双非）",required:!0},{id:"gpa",label:"本科均分/GPA",type:"text",placeholder:"如：均分82/3.2"},{id:"extra_info",label:"其他信息（竞赛/论文/项目等）",type:"textarea",placeholder:"补充你的优势信息..."}],sections:["一、研究对象","二、应该看什么：5-8个观察维度","三、公开信息整理","四、初步分析","五、主要风险","六、需要继续验证的问题","七、初步结论"]},
study_plan:{title:"复习规划方案",icon:"📅",desc:"输入目标和当前水平，获得四阶段复习时间表",fields:[{id:"target_school_major",label:"目标院校与专业",type:"text",placeholder:"如：浙江大学 计算机专硕",required:!0},{id:"current_level",label:"当前各科水平",type:"textarea",placeholder:"如：\n政治：零基础\n英语：六级550\n数学一：高数过完一轮\n专业课408：数据结构已学完",required:!0},{id:"days_left",label:"距考试剩余天数",type:"number",placeholder:"如：200",required:!0},{id:"daily_hours",label:"每日可用学习时间（小时）",type:"number",placeholder:"如：8",required:!0},{id:"notes",label:"备注",type:"textarea",placeholder:"如：每周日下午休息；9月有实习"}],sections:["一、当前状态盘点","二、总时间表：基础→强化→冲刺→模考四阶段","三、阶段目标","四、每周/每日任务拆解","五、资源建议","六、风险与调整"]},
knowledge_qa:{title:"知识点答疑",icon:"💡",desc:"输入一道题或概念，获得拆解、步骤与易错点分析",fields:[{id:"subject",label:"科目",type:"select",options:["政治","英语","数学（数学一）","数学（数学二）","数学（数学三）","专业课408","其他专业课"],required:!0},{id:"question",label:"题目/概念描述",type:"textarea",placeholder:"详细描述题目或你不理解的概念...",required:!0},{id:"your_answer",label:"你的解答（选填）",type:"textarea",placeholder:"已尝试过的思路..."},{id:"confusion_point",label:"卡在哪里？",type:"textarea",placeholder:"具体困惑的点..."}],sections:["一、问题拆解：这道题/概念在考什么","二、核心概念：用一句话讲清底层原理","三、解题步骤：分步推导，标注易错环节","四、易错点：考生常踩的坑","五、同类变式","六、溯源：对应教材章节/考纲条目"]},
error_review:{title:"错题复盘分析",icon:"📝",desc:"输入错题信息，获得错因分类、知识漏洞与改进方案",fields:[{id:"subject",label:"科目",type:"select",options:["政治","英语","数学","专业课408","其他"],required:!0},{id:"topic",label:"知识点",type:"text",placeholder:"如：二重积分、定语从句",required:!0},{id:"question_desc",label:"题目描述",type:"textarea",placeholder:"简述题目内容...",required:!0},{id:"wrong_answer",label:"错误答案/思路",type:"textarea",placeholder:"当时的解答过程...",required:!0},{id:"correct_answer",label:"正确答案",type:"textarea",placeholder:"如有正确答案写这里"},{id:"error_image",label:"错题图片（选填）",type:"file",accept:"image/*"}],sections:["一、错题画像：科目/知识点/错答vs正答","二、错因分类：概念不清/计算失误/审题偏差/方法不会/时间不够","三、知识漏洞：暴露了哪些未掌握点","四、改进动作：针对性练习与重学计划","五、同类题验证"]},
progress_track:{title:"进度跟踪报告",icon:"📊",desc:"输入本周学习记录，获得偏差分析与下周规划",fields:[{id:"week_range",label:"本周日期范围",type:"text",placeholder:"如：7月21日-7月27日",required:!0},{id:"plan_summary",label:"本周原计划",type:"textarea",placeholder:"简述本周计划完成的内容...",required:!0},{id:"completed_tasks",label:"实际完成情况",type:"textarea",placeholder:"✅完成xxx\n⚠️部分完成xxx\n❌未开始xxx",required:!0},{id:"hours_spent",label:"各科实际用时（小时）",type:"textarea",placeholder:"政治：5h\n英语：8h\n数学：20h\n专业课：15h"},{id:"difficulties",label:"遇到的困难",type:"textarea",placeholder:"本周的阻碍..."}],sections:["一、本周已完成","二、偏差分析：计划vs实际","三、下一步重点","四、风险提示"]}
};

// ==================== Claude 系统提示词 ====================
function getSystemPrompt(reportType){
  var t=TEMPLATES[reportType];
  return '你是一个 AI 考研规划与学习助手。你的任务不是替学生做决定，也不是承诺录取，而是帮助用户基于公开信息和自身情况，完成考研的择校、规划、答疑与复盘。\n\n四个关键点：\n- 身份：研究型学习助理，不是顾问式聊天。\n- 任务边界：只做规划、答疑、复盘辅助，不替学生决定人生，不承诺“一定能上岸”。\n- 工作步骤：先拆解，再检索，再分析，再输出。\n- 风险限制：标注不确定信息；涉及分数线/报录比等数据，必须提示“以官方最新公布为准”。\n\n处理任何任务时，固定走 6 步流程：\n1. 确认研究对象\n2. 生成研究框架\n3. 调用搜索或资料工具\n4. 提取关键信息\n5. 生成结构化报告\n6. 列出待验证问题\n\n必须遵守的约束：\n1. 不承诺录取结果，不替用户做人生决定。\n2. 涉及报录比、分数线、招生目录等，必须提示“以研招网及院校官网当年最新公布为准”。\n3. 信息缺失时明确写“未取到 / 需补充”，禁止胡乱补全。\n4. 先拆解再结论，先流程再输出；宁可多问一句，不要凭空给方案。\n5. 每次输出都带“待验证问题”栏。\n6. 诚实标注自身弱点，引导用户去官方核实。\n\n现在你需要生成一份 **' + t.title + '**。' +
'请严格按照以下段落标题输出，不得增减或改变标题：\n' + t.sections.map(function(s,i){return (i+1)+'. '+s;}).join('\n') + '\n\n每个部分都要有实质性内容，不可只写“待补充”。涉及数据的地方标注数据来源的可靠性。列出至少 3 个待验证问题。结尾必须加上声明：“⚠️ 本报告为 AI 辅助生成，所有数据请以研招网及院校官网当年最新公布为准。”。';
}

function buildUserPrompt(reportType, data){
  var t=TEMPLATES[reportType];
  var p='请根据以下用户信息，生成一份'+t.title+'。\n\n【用户提供的信息】\n';
  t.fields.forEach(function(f){
    if(f.type==='file')return;
    p += '- ' + f.label + '：' + (data[f.id] || '未提供') + '\n';
  });
  p += '\n【生成要求】\n- 严格按系统提示中列出的段落标题输出\n- 每个部分都要有实质性内容\n- 基于用户信息做个性化分析，不要泛泛而谈\n- 按 "身份定位 → 拆解问题 → 分析 → 输出 → 风险提示" 的流程推进\n- 结尾带「待验证问题」栏和官方核实声明';
  return p;
}

// ==================== AI 调用 ====================
async function callClaude(systemPrompt, userPrompt){
  var key = getApiKey();
  var resp = await fetch(API_URL, {
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:MODEL,max_tokens:4096,temperature:0.7,system:systemPrompt,messages:[{role:'user',content:userPrompt}]})
  });
  if(!resp.ok){var e=await resp.text();throw new Error('API Error '+resp.status+': '+e.slice(0,200));}
  var j=await resp.json();
  return j.content[0].text;
}

async function callClaudeStream(systemPrompt, userPrompt, onChunk){
  var key = getApiKey();
  var resp = await fetch(API_URL, {
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:MODEL,max_tokens:4096,temperature:0.7,system:systemPrompt,messages:[{role:'user',content:userPrompt}],stream:!0})
  });
  if(!resp.ok){var e=await resp.text();throw new Error('API Error '+resp.status+': '+e.slice(0,200));}
  var reader=resp.body.getReader(),decoder=new TextDecoder(),full='',buffer='';
  while(true){
    var{done,value}=await reader.read();
    if(done)break;
    buffer+=decoder.decode(value,{stream:!0});
    var lines=buffer.split('\n'); buffer=lines.pop()||'';
    for(var i=0;i<lines.length;i++){
      var line=lines[i].trim(); if(!line.startsWith('data: '))continue;
      var data=line.slice(6); if(data==='[DONE]')continue;
      try{var j=JSON.parse(data);if(j.type==='content_block_delta'&&j.delta&&j.delta.text){full+=j.delta.text;onChunk(full);}}catch(ignore){}
    }
  }
  return full;
}

// ==================== 模板兜底（无API Key 时使用） ====================
function genFallback(type,data){
  var t=TEMPLATES[type], now=new Date().toLocaleString('zh-CN');
  var L=[]; L.push('# '+t.title,'*生成时间：'+now+' | 离线模板模式 | 请配置 API Key 获得 AI 分析*','');
  L.push('> ⚠️ **当前为离线模板模式**，内容为固定框架。点击右上角 ⚙️ 设置 Claude API Key 后，将由 AI 针对你的实际情况生成个性化分析。','');
  function h(s){L.push('## '+s,'');}
  t.sections.forEach(function(s,i){
    h(s);
    var vals=[];
    t.fields.forEach(function(f){if(f.type!=='file')vals.push(f.label+'：'+(data[f.id]||'未提供'));});
    L.push('**你提供的信息**：');
    vals.forEach(function(v){L.push('- '+v);});
    L.push('');
    L.push('*（此部分在 AI 模式下将生成针对性分析。当前为模板框架，请配置 API Key 启用 AI。）*');
    L.push('');
  });
  L.push('\n---\n### 📋 待验证\n1.院校信息回官网核实\n2.分数线以官方为准\n3.招生简章每年可能调整\n\n> ⚠️ 本报告为模板生成。**配置 Claude API Key 后获得 AI 个性化分析**。数据以研招网(yz.chsi.com.cn)及院校官网为准。');
  return L.join('\n');
}

// ==================== Markdown 渲染 ====================
function md2html(md){
  var h=md.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  h=h.replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h2>$1</h2>').replace(/^# (.+)$/gm,'<h1>$1</h1>');
  h=h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>');
  h=h.replace(/^---$/gm,'<hr>').replace(/^> (.+)$/gm,'<blockquote>$1</blockquote>');
  h=h.replace(/^- (.+)$/gm,'<li>$1</li>');
  h=h.replace(/^\|(.+)\|$/gm,function(m){var c=m.split('|').filter(function(x){return x.trim()});if(c.every(function(x){return /^-+$/.test(x.trim())}))return'';return'<tr>'+c.map(function(x){var t=x.trim();return t.indexOf('**')===0?'<th>'+t+'</th>':'<td>'+t+'</td>'}).join('')+'</tr>'});
  h=h.replace(/\n\n/g,'</p><p>').replace(/\n/g,'<br>');
  h=h.replace(/(<tr>[\s\S]*?<\/tr>)+/g,'<table>$&</table>');
  h=h.replace(/(<li>[\s\S]*?<\/li>)+/g,'<ul>$&</ul>');
  return'<p>'+h+'</p>';
}

var currentType=null, lastReport=null;
var history=JSON.parse(localStorage.getItem('ky_reports')||'[]');

function showHome(){
  currentType=null;
  var ai=getApiKey()?'<span style="color:var(--a)">🤖 AI 模式已就绪 (Claude)</span>':'<span style="color:var(--w)">⚠️ 未配置 API - 点击右上角 ⚙️ 设置</span>';
  var H='<div class="hero"><h1>🎓 考研助手智能体</h1><p>AI 考研规划与学习助手 · Claude 驱动 · Agent 2.0</p><p style="margin-top:8px;font-size:.9rem">'+ai+'</p><div class="badges"><span>🔍观察</span><span>🧠思考</span><span>💾记忆</span><span>⚡行动</span><span>🔄反思</span></div></div><div class="cards">';
  for(var k in TEMPLATES){var t=TEMPLATES[k];H+='<div class="card" onclick="showReport(\''+k+'\')"><span class="icon">'+t.icon+'</span><div><h3>'+t.title+'</h3><p>'+t.desc+'</p><span class="badge">'+t.sections.length+'个分析维度</span></div></div>';}
  H+='</div><div class="section"><h2>⚙️ Agent 工作流程</h2><div class="steps">';
  ['确认对象','研究框架','调工具检索','提取信息','结构化报告','列待验证'].forEach(function(s,i){H+='<div class="step"><div class="step-num">'+(i+1)+'</div><div class="step-label">'+s+'</div></div>'+(i<5?'<span style="color:var(--pl);font-size:1.2rem">→</span>':'');});
  H+='</div></div><div class="section warn"><h2>⚠️ 必守红线</h2><ul><li>不承诺录取，不替用户做人生决定</li><li>报录比/分数线以官方当年公布为准</li><li>缺数据标注「未取到」，禁止编造</li><li>每次输出带「待验证问题」栏</li></ul></div>';
  document.getElementById('app').innerHTML=H;
  document.getElementById('navLinks').classList.remove('show');
  updateAiDot();
}

function showReport(type){
  currentType=type; var t=TEMPLATES[type];
  var H='<div style="margin-bottom:16px"><a href="#" onclick="showHome();return false" style="color:var(--p);text-decoration:none;font-size:.9rem">← 返回</a></div>';
  H+='<h1 style="font-size:1.6rem;margin-bottom:4px">'+t.icon+' '+t.title+'</h1><p style="color:var(--tm);margin-bottom:20px">'+t.desc+'</p>';
  H+='<div class="report-layout"><div class="form-card"><h2>📋 填写信息</h2><p class="form-hint">越详细，AI 分析越精准</p><form id="rf" onsubmit="return handleSubmit(event)">';
  t.fields.forEach(function(f){
    H+='<div class="fg"><label for="'+f.id+'">'+f.label+(f.required?'<span class="req">*</span>':'')+'</label>';
    if(f.type==='text') H+='<input type="text" id="'+f.id+'" placeholder="'+(f.placeholder||'')+'" '+(f.required?'required':'')+'>';
    else if(f.type==='textarea') H+='<textarea id="'+f.id+'" placeholder="'+(f.placeholder||'')+'" rows="3" '+(f.required?'required':'')+'></textarea>';
    else if(f.type==='number') H+='<input type="number" id="'+f.id+'" placeholder="'+(f.placeholder||'')+'" min="1" '+(f.required?'required':'')+'>';
    else if(f.type==='select'){H+='<select id="'+f.id+'" '+(f.required?'required':'')+'><option value="">-- 请选择 --</option>'; (f.options||[]).forEach(function(o){H+='<option>'+o+'</option>';}); H+='</select>';}
    else if(f.type==='file') H+='<div class="file-up"><input type="file" id="'+f.id+'" accept="'+(f.accept||'')+'" onchange="previewFile(this)"><label for="'+f.id+'">📁 点击上传图片</label><div id="'+f.id+'-preview" style="margin-top:4px;font-size:.8rem;color:var(--a)"></div></div>';
    H+='</div>';
  });
  var hasApi=getApiKey();
  H+='<button type="submit" class="btn-gen" id="btnGen">'+(hasApi?'🤖 AI 生成报告':'📋 模板生成报告')+'</button>';
  if(!hasApi) H+='<p class="api-badge"><span style="color:var(--w)">⚠️</span> <span onclick="showSettings()" style="color:var(--p);cursor:pointer;text-decoration:underline">设置 Claude API Key</span> 启用 AI 分析</p>';
  else H+='<p class="api-badge"><span style="color:var(--a)">🤖</span> AI 模式 · 将由 Claude 生成个性化分析</p>';
  H+='</form></div>';
  H+='<div class="result-box"><div id="rp" class="placeholder"><div class="p-icon">📄</div><h3>报告在此展示</h3><p style="color:var(--tm);margin-top:8px">填写表单后点生成</p></div>';
  H+='<div id="rl" class="loading" style="display:none"><div class="spinner"></div><p id="rl-text">AI 正在分析...</p></div>';
  H+='<div id="rc" style="display:none"><div class="toolbar"><button onclick="dlReport()" class="btn-dl">📥 下载 MD</button><button onclick="showReport(\''+type+'\')">🔄 重新</button></div><div class="report-body" id="rb"></div></div></div></div>';
  H+='<div class="history"><h3>📚 历史</h3><div id="hl"><p class="h-empty">暂无</p></div></div>';
  document.getElementById('app').innerHTML=H;
  document.getElementById('navLinks').classList.remove('show');
  renderHistory(); window.scrollTo(0,0);
}

function showSettings(){
  var key=getApiKey();
  var H='<div style="margin-bottom:16px"><a href="#" onclick="showHome();return false" style="color:var(--p);text-decoration:none;font-size:.9rem">← 返回</a></div>';
  H+='<h1 style="font-size:1.6rem;margin-bottom:16px">⚙️ API 设置</h1>';
  H+='<div class="settings-panel"><label>Claude API Key</label><p class="hint">密钥仅存储在浏览器本地，直连 Anthropic API。</p><p class="hint">获取 Key：<a href="https://console.anthropic.com/" target="_blank">console.anthropic.com</a> → API Keys</p>';
  H+='<input type="password" id="apikey-input" placeholder="sk-ant-api03-..." value="'+key.replace(/"/g,'&quot;')+'" style="width:100%;padding:10px;border:1px solid var(--b);border-radius:var(--rs);font-size:.9rem;font-family:monospace">';
  H+='<div class="btn-row"><button class="btn-save" onclick="saveApiKey()">💾 保存</button><button onclick="clearApiKey()">🗑 清除</button><button onclick="testApiKey()">🔍 测试连接</button></div>';
  H+='<div id="api-status" style="margin-top:12px;font-size:.85rem"></div></div>';
  document.getElementById('app').innerHTML=H;
}

function saveApiKey(){var v=document.getElementById('apikey-input').value.trim();setApiKey(v);document.getElementById('api-status').innerHTML='<span style="color:var(--a)">✅ 已保存</span>';updateAiDot();}
function clearApiKey(){setApiKey('');document.getElementById('apikey-input').value='';document.getElementById('api-status').innerHTML='<span style="color:var(--tm)">已清除</span>';updateAiDot();}
async function testApiKey(){
  var st=document.getElementById('api-status'); st.innerHTML='<span style="color:var(--w)">⏳ 测试中...</span>';
  try{
    var r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json','x-api-key':getApiKey(),'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:MODEL,max_tokens:10,messages:[{role:'user',content:'hi'}]})});
    if(r.ok) st.innerHTML='<span style="color:var(--a)">✅ 连接成功！API Key 有效</span>';
    else{var e=await r.text();st.innerHTML='<span style="color:#ef4444">❌ 失败：'+e.slice(0,150)+'</span>';}
  }catch(err){st.innerHTML='<span style="color:#ef4444">❌ 网络错误：'+err.message+'</span>';}
}

function previewFile(input){var p=document.getElementById(input.id+'-preview');if(input.files[0])p.innerHTML='📎 '+input.files[0].name+' ('+(input.files[0].size/1024).toFixed(1)+' KB)';else p.innerHTML='';}

async function handleSubmit(e){
  e.preventDefault();
  var t=TEMPLATES[currentType], data={};
  t.fields.forEach(function(f){if(f.type!=='file')data[f.id]=document.getElementById(f.id).value;});
  var btn=document.getElementById('btnGen'), hasApi=getApiKey();
  btn.disabled=!0; btn.textContent='⏳';
  document.getElementById('rp').style.display='none';
  document.getElementById('rc').style.display='none';
  document.getElementById('rl').style.display='block';

  if(!hasApi){
    // 离线模板模式
    setTimeout(function(){
      var c=genFallback(currentType,data);
      showResult(c,currentType);
      btn.disabled=!1; btn.textContent='📋 模板生成报告';
    },400);
  }else{
    // AI 模式
    var sp=getSystemPrompt(currentType), up=buildUserPrompt(currentType,data);
    document.getElementById('rl-text').textContent='🤖 Claude 正在分析...';
    document.getElementById('rb').innerHTML='<div class="streaming" id="stream-content"></div>';
    document.getElementById('rl').style.display='none';
    document.getElementById('rc').style.display='block';

    try{
      var fullText=await callClaudeStream(sp,up,function(text){
        document.getElementById('stream-content').innerHTML=md2html(text);
        document.getElementById('stream-content').classList.add('streaming');
      });
      document.getElementById('stream-content').classList.remove('streaming');
      document.getElementById('rb').innerHTML=md2html(fullText);
      lastReport={type:currentType,content:fullText,time:new Date().toISOString(),ai:!0};
      history.unshift(lastReport); if(history.length>50)history.length=50;
      localStorage.setItem('ky_reports',JSON.stringify(history));
      renderHistory();
    }catch(err){
      document.getElementById('rb').innerHTML='<div style="color:#ef4444;padding:20px"><strong>❌ AI 调用失败</strong><p>'+err.message+'</p><p style="margin-top:12px">请检查：<br>1. API Key 是否正确<br>2. 网络是否能访问 api.anthropic.com<br>3. API Key 是否有余额</p></div>';
      document.getElementById('rl').style.display='none';
      document.getElementById('rc').style.display='block';
    }
    btn.disabled=!1; btn.textContent='🤖 AI 生成报告';
  }
}

function showResult(content,type){
  document.getElementById('rl').style.display='none';
  document.getElementById('rc').style.display='block';
  document.getElementById('rb').innerHTML=md2html(content);
  lastReport={type:type,content:content,time:new Date().toISOString(),ai:!1};
  history.unshift(lastReport); if(history.length>50)history.length=50;
  localStorage.setItem('ky_reports',JSON.stringify(history));
  renderHistory();
  document.getElementById('rc').scrollIntoView({behavior:'smooth'});
}

function renderHistory(){
  var el=document.getElementById('hl'); if(!el)return;
  if(!history.length){el.innerHTML='<p class="h-empty">暂无记录</p>';return;}
  el.innerHTML=history.slice(0,20).map(function(r,i){
    var t=TEMPLATES[r.type], d=new Date(r.time);
    var label=(r.ai?'🤖 ':'📋 ')+t.title;
    return'<div class="h-item"><span>'+t.icon+'</span><span style="flex:1">'+label+'</span><span style="font-size:.75rem;color:var(--tm)">'+d.toLocaleString('zh-CN')+'</span><a href="#" onclick="loadHist('+i+');return false">查看</a></div>';
  }).join('');
}

function loadHist(i){var r=history[i];showReport(r.type);setTimeout(function(){document.getElementById('rp').style.display='none';document.getElementById('rc').style.display='block';document.getElementById('rb').innerHTML=md2html(r.content);lastReport=r;},300);}
function dlReport(){if(!lastReport)return;var b=new Blob([lastReport.content],{type:'text/markdown;charset=utf-8'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=lastReport.type+'_'+new Date().toISOString().slice(0,10)+'.md';a.click();}

// 初始化
updateAiDot();
showHome();
</script>
